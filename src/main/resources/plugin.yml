name: LandWard
version: '${version}'
main: io.github.devkruidenier.landward.LandWardPlugin
description: Simple chunk claims and reliable protection for Paper, Spigot, CraftBukkit and Folia survival servers.
api-version: '26.2'
folia-supported: true
author: DEVKruidenier
website: https://github.com/DEVKruidenier/LandWard
softdepend:
  - BlueMap
  - WorldGuard
  - Vault
  - Plan
  - Essentials
  - EssentialsAntiBuild
  - EssentialsXAntiBuild
  - EssentialsSpawn
  - EssentialsProtect
  - EssentialsXProtect
  - squaremap
  - Pl3xMap
  - PlaceholderAPI
  - CombatLogX
  - PvPManager
  - DeluxeCombat
  - EternalCombat
commands:
  claim:
    description: Opens LandWard or manages land claims.
    usage: /claim
    aliases: [land, landward]
    permission: landward.use
  claimadmin:
    description: Opens the LandWard administrator claim map.
    usage: /claimadmin
    permission: landward.admin
permissions:
  landward.warps.unlimited:
    description: Explicitly grants unlimited named land warps; not granted to operators by default.
    default: false
  landward.pladmin:
    description: Receives update notifications when joining the server.
    default: op
  landward.use:
    description: Allows use of the main LandWard command and its aliases.
    default: true
  landward.admin:
    description: Grants access to LandWard administration features.
    default: op
  landward.bypass:
    description: Allows toggling the temporary LandWard protection bypass with /claim bypass.
    default: op
  landward.dbadmin:
    description: Allows LandWard storage migration and maintenance.
    default: op

  landward.protection.create:
    description: Create personal locks on eligible blocks in player lands.
    default: true
  landward.protection.own:
    description: Manage personal locks owned by your UUID.
    default: true
  landward.protection.manage:
    description: View and remove personal locks in land you currently own; does not grant inventory access.
    default: true
  landward.admin.protection.manage:
    description: Administratively manage personal lock records; does not grant inventory access.
    default: op
  landward.admin.protection.bypass:
    description: Bypass only personal LandWard locks, subject to normal claim and other plugin rules.
    default: op
