name: LandWard
version: '${version}'
main: io.github.devkruidenier.landward.LandWardPlugin
description: Simple chunk claims and reliable protection for Paper survival servers.
api-version: '26.2'
author: DEVKruidenier
website: https://github.com/DEVKruidenier/LandWard
softdepend:
  - BlueMap
  - dynmap
  - WorldGuard
  - Vault
  - Plan
  - Essentials
  - EssentialsAntiBuild
  - EssentialsXAntiBuild
  - EssentialsSpawn
  - EssentialsProtect
  - EssentialsXProtect
  - squaremap
  - Pl3xMap
  - PlaceholderAPI
  - CombatLogX
  - PvPManager
  - DeluxeCombat
  - EternalCombat
commands:
  claim:
    description: Opens LandWard or manages land claims.
    usage: /claim
    aliases: [land, landward]
    permission: landward.use
  claimadmin:
    description: Opens the LandWard administrator claim map.
    usage: /claimadmin
    permission: landward.admin
permissions:
  landward.use:
    description: Allows use of the main LandWard command and its aliases.
    default: true
  landward.admin:
    description: Grants access to LandWard administration features.
    default: op
  landward.bypass:
    description: Bypasses LandWard claim protection.
    default: op
