# Installed LandWard version for reference only. LandWard updates this value automatically; do not edit it.
plugin-version: '${version}'

# Folia: player/region scheduling is selected automatically; no scheduler setting is needed.
# Optional integrations must independently support your server and Minecraft version.
# CraftBukkit chat delivery is included; no separate chat plugin or library is required.
language:
  # English is the default. All supported codes are documented in the Wiki Languages page.
  # Example: fi_FI for Finnish, nb_NO for Bokmal (Java client no_no is recognized too).
  # Default language used for console senders and players without a matching client locale.
  default: en_US
  # Language used only for startup, storage and update messages in the server console.
  console: en_US
  # When true, use each player's Minecraft client language if LandWard ships that locale.
  use-client-locale: true
  # Safe fallback used when a requested translation key or locale is unavailable.
  fallback: en_US

placeholders:
  # Values are language keys, not literal text. Keep the double quotes.
  # Use "" to show nothing; put a key inside the quotes to enable translated text.
  # Example: unclaimed-land-name: "placeholders.unclaimed"
  # Edit the text in lang/<locale>.yml. Normal land/player names stay unchanged.
  # Uses the requested player's language; offline owner requests use language.default.
  unclaimed-land-name: ""
  no-land-name: ""
  unclaimed-owner-name: ""
  # Safe Zones have no player owner. Use "" to hide this translated label.
  server-owner-name: "placeholders.server-owner"

storage:
  # Migration failures report the failed phase, differing record/field and backup status.
  # A matching imported target can be reused; a different target is never overwritten.
  # Storage backend: sqlite stores locally; mysql stores claims in a shared MySQL/MariaDB database.
  type: sqlite
  mysql:
    # Database server hostname or IP address. Used only when storage.type is mysql.
    host: localhost
    # TCP port for MySQL/MariaDB. The normal MySQL port is 3306.
    port: 3306
    # Existing database/schema where LandWard may create its own tables.
    database: landward
    # Database account with permission to create and modify LandWard tables.
    username: minecraft
    # Password for the database account. Keep this file private and never commit real credentials.
    password: change-me
    # Enable TLS for the MySQL connection when the database server is configured for it.
    ssl: false
    # Maximum number of reusable database connections. Increase only for large networks.
    pool-size: 10

metrics:
  # Send anonymous aggregate statistics through bStats; its global opt-out is also respected.
  # Includes storage type, configured default language, payment mode, integration availability,
  # and grouped counts of player lands, all claimed chunks, Safe Zones and named warps.
  # Count groups: 0, 1-10, 11-50, 51-100, 101-500, 501+. No names, addresses or locations.
  # Changes to this switch take effect after /claimadmin reload or a restart.
  enabled: true

console:
  # Use coloured output for the LandWard startup banner and status messages when supported by the server.
  colored-output: true

updates:
  # Enable official GitHub release checks at startup, for info/update commands and permitted login notices.
  enabled: true
  # Notify operators and players with landward.pladmin on login when an official update is available.
  # Notifications explain /landward update; downloading still requires landward.admin.
  notify-on-join: true
  # Verified downloads retain their release filename in plugins/LandWard/updates/.
  # The active plugin is never replaced automatically. Largest download size in MiB:
  maximum-download-megabytes: 32

claims:
  # Maximum map-center offset in chunks along X and Z from where the map was opened.
  # Navigation moves one chunk per click without teleporting. Applies to player/admin maps.
  # 0 disables movement; values are clamped to 0..1024. Default: 30 each direction.
  # Visible edge chunks extend another 4 chunks along X and 2 along Z.
  map-navigation-limit: 30
  # Require every new chunk claim to share a horizontal edge with an existing chunk of the same land.
  require-adjacent-chunks: true
  # Maximum lands a player can own. LandWard is designed around one owned land per player.
  maximum-lands-per-player: 1
  # Maximum chunks in one land. Set to -1 for unlimited chunks.
  maximum-chunks-per-land: 25
  # World names where LandWard is fully inactive. Every other world is active.
  # Example world: LandWard is disabled in this world until you remove it from this list.
  disabled-worlds:
    - myworld

player-claims:
  # Defaults for NEW player lands only. Existing land overrides are preserved.
  # true allows the effect, false denies it. Damage settings apply to every player.
  # Explosion block damage and player damage are independent; other protections remain.
  # Fluid flow switches apply only inside one land; claim boundaries stay protected.
  environment:
    fire-spread: false
    fall-damage: true
    tnt-block-damage: false
    other-explosion-block-damage: false
    explosion-player-damage: true
    fire-player-damage: true
    lava-player-damage: true
    mob-block-changes: false
    water-flow: true
    lava-flow: true
  member-rights:
    # Default access for members added to a newly created player land.
    # The land owner can change these defaults for their own land and can also customise each member separately.
    # Existing lands and members keep their own saved rights when this configuration changes.
    build: true
    containers: true
    entities: true

admin-claims:
  # Defaults for NEW Safe Zones only. Upgraded lands retain survival damage behavior.
  # Fire spread/burning is intentionally denied in all upgraded lands for safety.
  # true allows the effect, false denies it. These per-land rules affect all players.
  # World rules and other plugins still take priority. Fluid boundaries stay protected.
  environment:
    fire-spread: false
    fall-damage: false
    tnt-block-damage: false
    other-explosion-block-damage: false
    explosion-player-damage: false
    fire-player-damage: false
    lava-player-damage: false
    mob-block-changes: false
    water-flow: true
    lava-flow: true
  # Optional name for the first server-owned administrative land.
  # Keep default-name: '' to use the selected LandWard language.
  # To set a custom name, use for example: default-name: Spawn
  # Configure this before creating the first admin claim.
  default-name: ''
  member-rights:
    # Default access for trusted members added to a newly created Safe Zone.
    # Administrators can customise each trusted member separately in /claimadmin.
    # Existing Safe Zones and members keep their own saved rights when this configuration changes.
    build: true
    containers: true
    entities: true
  protection:
    # Allow all players to place/break blocks and use building tools in Safe Zones.
    # Keep false to protect server areas. Trusted members can have separate build rights.
    allow-build: false
    # Allow all players to interact with entities, use leads and place entities in Safe Zones.
    # This does not enable PvP, mob killing, container access or hostile natural spawning.
    # Trusted members can have separate entity-interaction rights.
    allow-entities: false
    # Allow player-versus-player combat inside administrative claims.
    allow-pvp: false
    # Allow players to kill hostile mobs in administrative claims.
    allow-hostile-mob-kills: false
    # Allow players to kill passive mobs such as cows and pigs in administrative claims.
    allow-passive-mob-kills: true
    # Allow opening chests, Ender Chests and compatible crate inventories in administrative claims.
    allow-containers: false
    # Allow using doors and trapdoors in administrative claims.
    allow-doors: false
    # Allow using signs, buttons and levers in administrative claims.
    allow-interactions: false
    # Allow hostile mobs to naturally spawn in administrative claims.
    allow-hostile-mob-spawns: false

notifications:
  claim-boundaries:
    # Show an actionbar message only when a player crosses into or out of a claimed chunk.
    enabled: true

payments:
  # Claim payment mode: free, experience, or vault. Vault uses the active Vault economy provider.
  mode: free
  # Raw total experience points charged for creating or adding one claimed chunk in experience mode.
  experience-points-per-chunk: 150
  # Money charged for creating or adding one claimed chunk in vault mode.
  vault-money-per-chunk: 100.0

rename:
  # XP levels charged when a player confirms a land rename in the anvil GUI. Set to 0 for free renames.
  experience-level-cost: 0

teleportation:
  # Named warps belong to a player land. Highest explicit landward.warps.<number>
  # wins; base-limit applies only when no numeric permission is present.
  # Only an explicit landward.warps.unlimited grant gives unlimited warps; not OP.
  warps:
    base-limit: 3
  # Both owners/members and administrators wait by default. 0 disables the warmup.
  # Movement, damage, combat, membership loss or removed destinations cancel it.
  warp-delay-seconds: 2
  admin-warp-delay-seconds: 2
  # Delay before an owner is teleported to the first claimed chunk of their land from the LandWard menu. Set to 0 for instant teleportation.
  player-land-delay-seconds: 2

integrations:
  vanilla-spawn-protection:
    # Prevent player claims in the built-in server.properties spawn-protection square around the primary world spawn.
    # Safe Zones created through ClaimAdmin deliberately bypass this check so spawn can be protected by LandWard.
    enabled: true
  worldguard:
    # Enable WorldGuard overlap checks for player claims when WorldGuard is installed on this server.
    enabled: true
    # Refuse a player claim if any block column in its chunk overlaps a WorldGuard protected region.
    # Safe Zones created through ClaimAdmin deliberately bypass this check for protected server areas.
    deny-any-overlap: true
  bluemap:
    # Enable the optional BlueMap claim-marker integration when BlueMap is installed.
    enabled: true
  squaremap:
    # Enable the optional Squaremap claim-marker layer when Squaremap is installed.
    enabled: true
  pl3xmap:
    # Enable the optional Pl3xMap JSON marker layer when Pl3xMap is installed.
    enabled: true
  placeholderapi:
    # Register LandWard placeholders when PlaceholderAPI is installed. The placeholders are documented in the wiki.
    enabled: true
  plan:
    # Enable the optional Plan analytics integration when Plan is installed. It supplies aggregate and per-player land statistics to the Plan web panel.
    enabled: true
  combat-tag:
    # Keep combat-tagged players from using claim protection to escape a PvP encounter.
    enabled: true
    # Both tagged combatants may damage each other inside claims until their combat tag expires.
    claim-pvp-bypass: true
    # Block /claim unclaim while the player is combat-tagged.
    block-claim-abandon: true
    internal-tracker:
      # Track successful PvP hits when no external combat tagger supplies a tag.
      enabled: true
      # Number of seconds for the fallback LandWard combat tag after a successful PvP hit.
      duration-seconds: 15
    external-placeholderapi:
      # Query supported combat plugins through PlaceholderAPI when it is installed.
      enabled: true
      # CombatLogX, DeluxeCombat, PvPManager and EternalCombat defaults. Add a compatible placeholder here for another tagger.
      placeholders:
        - "%combatlogx_in_combat%"
        - "%deluxecombat_in_combat%"
        - "%pvpmanager_combat_timeleft%"
        - "%eternalcombat_opponent%"

# Built-in personal block protection; no external lock plugin is required.
# Disable this when another plugin manages personal block locks.
# Old configurations without this section are migrated with enabled: false.
# /claimadmin reload applies these options; stored locks survive disabling.
# Hoppers placed by the same owner can transfer items between protected storage.
# Connected owned hoppers retain private access; unknown/foreign hoppers cannot extract.
# Place legacy hoppers again to establish their owner; ownership is never guessed.
block-protection:
  # Supports chests (including copper variants), barrels, shulkers, doors,
  # trapdoors, gates, levers and buttons. Ordinary land permissions still apply.
  # Owners may expand their protected chests or break their own protected storage;
  # a remaining chest half retains the same protection and shared access.
  enabled: true
  # Automatically lock eligible blocks placed by players with creation permission.
  # Otherwise use Block Protection in the land menu.
  auto-protect: false
  # Logical units per player across all lands; a double chest counts as one.
  # -1 means unlimited.
  max-blocks-per-player: -1
  # Direct access to other members' personal locks; administrative removal is separate.
  land-owner-bypass: false
