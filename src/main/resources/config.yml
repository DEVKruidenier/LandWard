# Installed LandWard version for reference only. LandWard updates this value automatically; do not edit it.
plugin-version: 1.0.0.0

language:
  # Default language used for console senders and players without a matching client locale.
  default: en_US
  # Language used only for startup, storage and update messages in the server console.
  console: en_US
  # When true, use each player's Minecraft client language if LandWard ships that locale.
  use-client-locale: true
  # Safe fallback used when a requested translation key or locale is unavailable.
  fallback: en_US

storage:
  # Storage backend: sqlite stores locally; mysql stores claims in a shared MySQL/MariaDB database.
  type: sqlite
  mysql:
    # Database server hostname or IP address. Used only when storage.type is mysql.
    host: localhost
    # TCP port for MySQL/MariaDB. The normal MySQL port is 3306.
    port: 3306
    # Existing database/schema where LandWard may create its own tables.
    database: landward
    # Database account with permission to create and modify LandWard tables.
    username: minecraft
    # Password for the database account. Keep this file private and never commit real credentials.
    password: change-me
    # Enable TLS for the MySQL connection when the database server is configured for it.
    ssl: false
    # Maximum number of reusable database connections. Increase only for large networks.
    pool-size: 10

metrics:
  # Send anonymous aggregate server statistics through bStats. No player names or world data are sent.
  enabled: true

console:
  # Use coloured output for the LandWard startup banner and status messages when supported by the server.
  colored-output: true

updates:
  # Check GitHub Releases asynchronously during startup. This never blocks the server main thread.
  enabled: true
  # Largest GitHub release JAR that an administrator may stage with /claim update, in MiB.
  maximum-download-megabytes: 32

claims:
  # Require every new chunk claim to share a horizontal edge with an existing chunk of the same land.
  require-adjacent-chunks: true
  # Maximum lands a player can own. LandWard is designed around one owned land per player.
  maximum-lands-per-player: 1
  # Maximum chunks in one land. Set to -1 for unlimited chunks.
  maximum-chunks-per-land: 25
  # World names where LandWard is fully inactive. Every other world is active.
  # Example world: LandWard is disabled in this world until you remove it from this list.
  disabled-worlds:
    - myworld

player-claims:
  member-rights:
    # Default access for members added to a newly created player land.
    # The land owner can change these defaults for their own land and can also customise each member separately.
    # Existing lands and members keep their own saved rights when this configuration changes.
    build: true
    containers: true
    entities: true

admin-claims:
  # Optional name for the first server-owned administrative land.
  # Keep default-name: '' to use the selected LandWard language.
  # To set a custom name, use for example: default-name: Spawn
  # Configure this before creating the first admin claim.
  default-name: ''
  member-rights:
    # Default access for trusted members added to a newly created Safe Zone.
    # Administrators can customise each trusted member separately in /claimadmin.
    # Existing Safe Zones and members keep their own saved rights when this configuration changes.
    build: true
    containers: true
    entities: true
  protection:
    # Allow player-versus-player combat inside administrative claims.
    allow-pvp: false
    # Allow players to kill hostile mobs in administrative claims.
    allow-hostile-mob-kills: false
    # Allow players to kill passive mobs such as cows and pigs in administrative claims.
    allow-passive-mob-kills: true
    # Allow opening chests, Ender Chests and compatible crate inventories in administrative claims.
    allow-containers: false
    # Allow using doors and trapdoors in administrative claims.
    allow-doors: false
    # Allow using signs, buttons and levers in administrative claims.
    allow-interactions: false
    # Allow hostile mobs to naturally spawn in administrative claims.
    allow-hostile-mob-spawns: false

notifications:
  claim-boundaries:
    # Show an actionbar message only when a player crosses into or out of a claimed chunk.
    enabled: true

payments:
  # Claim payment mode: free, experience, or vault. Vault uses the active Vault economy provider.
  mode: free
  # Raw total experience points charged for creating or adding one claimed chunk in experience mode.
  experience-points-per-chunk: 150
  # Money charged for creating or adding one claimed chunk in vault mode.
  vault-money-per-chunk: 100.0

rename:
  # XP levels charged when a player confirms a land rename in the anvil GUI. Set to 0 for free renames.
  experience-level-cost: 0

integrations:
  vanilla-spawn-protection:
    # Prevent player claims in the built-in server.properties spawn-protection square around the primary world spawn.
    # Safe Zones created through ClaimAdmin deliberately bypass this check so spawn can be protected by LandWard.
    enabled: true
  worldguard:
    # Enable WorldGuard overlap checks for player claims when WorldGuard is installed on this server.
    enabled: true
    # Refuse a player claim if any block column in its chunk overlaps a WorldGuard protected region.
    # Safe Zones created through ClaimAdmin deliberately bypass this check for protected server areas.
    deny-any-overlap: true
  bluemap:
    # Enable the optional BlueMap claim-marker integration when BlueMap is installed.
    enabled: true
  squaremap:
    # Enable the optional Squaremap claim-marker layer when Squaremap is installed.
    enabled: true
  pl3xmap:
    # Enable the optional Pl3xMap JSON marker layer when Pl3xMap is installed.
    enabled: true
  placeholderapi:
    # Register LandWard placeholders when PlaceholderAPI is installed. The placeholders are documented in the wiki.
    enabled: true
  plan:
    # Enable the optional Plan analytics integration when Plan is installed. It supplies aggregate and per-player land statistics to the Plan web panel.
    enabled: true
  combat-tag:
    # Keep combat-tagged players from using claim protection to escape a PvP encounter.
    enabled: true
    # Both tagged combatants may damage each other inside claims until their combat tag expires.
    claim-pvp-bypass: true
    # Block /claim unclaim while the player is combat-tagged.
    block-claim-abandon: true
    internal-tracker:
      # Track successful PvP hits when no external combat tagger supplies a tag.
      enabled: true
      # Number of seconds for the fallback LandWard combat tag after a successful PvP hit.
      duration-seconds: 15
    external-placeholderapi:
      # Query supported combat plugins through PlaceholderAPI when it is installed.
      enabled: true
      # CombatLogX, DeluxeCombat, PvPManager and EternalCombat defaults. Add a compatible placeholder here for another tagger.
      placeholders:
        - "%combatlogx_in_combat%"
        - "%deluxecombat_in_combat%"
        - "%pvpmanager_combat_timeleft%"
        - "%eternalcombat_opponent%"
