name: Feature request
description: Suggest a practical improvement for LandWard.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the server problem first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the gameplay or administration need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — mention existing plugins, settings or workflows you considered.

