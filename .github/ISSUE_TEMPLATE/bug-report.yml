name: Bug report
description: Report something in LandWard that does not work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LandWard. Never include passwords, database credentials or private server addresses.
  - type: input
    id: landward-version
    attributes:
      label: LandWard version
      description: Find this with /claim info or in the startup log.
      placeholder: "1.0.0.0"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server software and version
      description: For example, Paper 26.3.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did before the problem occurred.
      placeholder: |
        1. Run /claim
        2. Open the chunk map
        3. Click an adjacent chunk
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste only the relevant lines and remove private information.
      render: text

