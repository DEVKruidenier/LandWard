name: Publish Hangar release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_number:
        description: Published LandWard version to upload to Hangar.
        required: true
        type: string
      changelog:
        description: Optional release notes for the Hangar version.
        required: false
        type: string
      sync_only:
        description: Only synchronise the Hangar resource page without publishing a new version.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    # Never expose the publishing secret to forks.
    if: github.repository == 'DEVKruidenier/LandWard'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish the Paper build and synchronise the resource page
        if: inputs.sync_only != true
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_CHANGELOG: ${{ github.event.release.body || inputs.changelog || '' }}
        run: |
          test -n "$HANGAR_API_TOKEN"
          ./gradlew test shadowJar publishPluginPublicationToHangar syncPluginPublicationMainResourcePagePageToHangar --no-daemon --stacktrace

      - name: Synchronise the Hangar resource page
        if: inputs.sync_only == true
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          test -n "$HANGAR_API_TOKEN"
          ./gradlew syncPluginPublicationMainResourcePagePageToHangar --no-daemon --stacktrace
