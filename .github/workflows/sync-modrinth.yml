name: Sync Modrinth project

on:
  workflow_dispatch:
    inputs:
      showcase_mode:
        description: Compare the live description with the previous commit, then optionally synchronize just the description.
        required: false
        type: choice
        default: standard
        options: [standard, check, update]
      version_number:
        description: Optional existing version whose changelog should match GitHub Releases.
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify publishing configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN"

      - name: Synchronize public project details
        if: inputs.showcase_mode == 'standard'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          jq -n \
            --rawfile body .github/modrinth/description.md \
            --arg source_url 'https://github.com/DEVKruidenier/LandWard' \
            --arg issues_url 'https://github.com/DEVKruidenier/LandWard/issues' \
            --arg wiki_url 'https://github.com/DEVKruidenier/LandWard/wiki' \
            '{body: $body, source_url: $source_url, issues_url: $issues_url, wiki_url: $wiki_url}' \
            > modrinth-project.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @modrinth-project.json \
            https://api.modrinth.com/v2/project/landward

      - name: Verify and selectively synchronize showcase description
        if: inputs.showcase_mode != 'standard'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SHOWCASE_MODE: ${{ inputs.showcase_mode }}
        run: |
          set -euo pipefail
          project=https://api.modrinth.com/v2/project/landward
          source=.github/modrinth/description.md
          git show "HEAD^:$source" > previous-description.md
          curl --fail --silent --show-error --header "Authorization: $MODRINTH_TOKEN" \
            "$project" > live-before.json
          jq -c '{status, gallery: [.gallery[]? | {title, is_gif: (.url | test("\\.gif([?#]|$)"; "i"))}]}' live-before.json
          jq -e --rawfile expected previous-description.md '
            def normalize: gsub("\r\n"; "\n") | sub("\n+$"; "");
            (.body | normalize) == ($expected | normalize)
          ' live-before.json > /dev/null || {
            echo 'Live body differs from the previous source. No update was applied.'
            exit 1
          }
          echo 'Live description matches the previous source.'
          if [[ "$SHOWCASE_MODE" == check ]]; then exit 0; fi
          jq -n --rawfile body "$source" '{body: $body}' > showcase-description.json
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" --header 'Content-Type: application/json' \
            --data @showcase-description.json "$project"
          curl --fail --silent --show-error --header "Authorization: $MODRINTH_TOKEN" \
            "$project" > live-after.json
          jq -e --rawfile expected "$source" --slurpfile before live-before.json '
            def normalize: gsub("\r\n"; "\n") | sub("\n+$"; "");
            ((.body | normalize) == ($expected | normalize)) and
            (.gallery == $before[0].gallery) and (.status == $before[0].status)
          ' live-after.json > /dev/null
          echo 'Live description verified. Gallery and visibility are unchanged.'

      - name: Synchronize existing release notes
        if: inputs.showcase_mode == 'standard' && inputs.version_number != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION_NUMBER: ${{ inputs.version_number }}
        run: |
          set -euo pipefail
          encoded_version=$(jq -rn --arg v "$VERSION_NUMBER" '$v | @uri')
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_version" > release.json
          jq -e --arg v "$VERSION_NUMBER" '.tag_name == $v and .draft == false and (.body | type == "string")' release.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/landward/version/$encoded_version" > version.json
          version_id=$(jq -er --arg v "$VERSION_NUMBER" 'select(.version_number == $v) | .id' version.json)
          jq '{changelog: .body}' release.json > changelog.json
          curl --fail-with-body --silent --show-error --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @changelog.json \
            "https://api.modrinth.com/v2/version/$version_id"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/version/$version_id" > updated-version.json
          jq -e --slurpfile expected changelog.json '.changelog == $expected[0].changelog' updated-version.json
