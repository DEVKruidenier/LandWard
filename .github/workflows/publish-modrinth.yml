name: Publish Modrinth release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_number:
        description: Published LandWard version to upload to Modrinth.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew test shadowJar --no-daemon

      - name: Publish release JAR to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_NUMBER: ${{ github.event.release.tag_name || inputs.version_number }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          RELEASE_CHANGELOG: ${{ github.event.release.body || '' }}
        run: |
          test -n "$MODRINTH_TOKEN"
          JAR="build/libs/LandWard-${VERSION_NUMBER}.jar"
          test -f "$JAR"
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then VERSION_TYPE='beta'; else VERSION_TYPE='release'; fi
          MODRINTH_PROJECT_ID="$(curl --fail-with-body --header "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/project/landward | jq -r '.id')"
          test -n "$MODRINTH_PROJECT_ID"
          if [ -n "$RELEASE_CHANGELOG" ]; then
            printf '%s' "$RELEASE_CHANGELOG" > release-changelog.md
          else
            cp CHANGELOG.md release-changelog.md
          fi
          jq -n \
            --arg name "LandWard $VERSION_NUMBER" \
            --arg version_number "$VERSION_NUMBER" \
            --arg version_type "$VERSION_TYPE" \
            --arg project_id "$MODRINTH_PROJECT_ID" \
            --rawfile changelog release-changelog.md \
            '{
              name: $name,
              version_number: $version_number,
              version_type: $version_type,
              project_id: $project_id,
              changelog: $changelog,
              loaders: ["paper", "spigot"],
              game_versions: ["26.2", "26.3"],
              featured: true,
              status: "listed",
              file_parts: ["landward"],
              primary_file: "landward",
              environment: "server_only",
              dependencies: []
            }' > modrinth-version.json
          curl --fail-with-body --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form 'data=@modrinth-version.json;type=application/json' \
            --form "landward=@$JAR;type=application/java-archive" \
            https://api.modrinth.com/v2/version
