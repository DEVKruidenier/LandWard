name: Verify packaged dependencies

on:
  pull_request:
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:
    inputs:
      include_macos:
        description: Include macOS ARM and Intel checks (hosted runner availability required).
        type: boolean
        default: false
  push:
    branches: [main, codex/optimize-universal-jar]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

jobs:
  native-storage:
    strategy:
      fail-fast: false
      matrix:
        # macOS checks remain available on demand; hosted capacity failures must
        # not generate failed runs on every ordinary source change.
        os: ${{ fromJSON(inputs.include_macos == true && '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15","macos-15-intel"]' || '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025"]') }}
        include:
          - os: windows-2025
            sqlite: '3.51.3.0'
            mysql: '9.6.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and verify the standalone artifact
        shell: bash
        run: ./gradlew clean test packagingTest --no-daemon -PserverSqliteVersion=${{ matrix.sqlite || '3.49.1.0' }} -PserverMysqlVersion=${{ matrix.mysql || '9.2.0' }}

  database-storage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.4', 'mariadb:11.8']
        drivers: [paper, spigot]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: fixture-root-password
          MYSQL_DATABASE: landward_packaging
          MYSQL_USER: landward_fixture
          MYSQL_PASSWORD: fixture-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent || mariadb-admin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Exercise the real shaded JDBC and relocated pool
        env:
          LANDWARD_MYSQL_INTEGRATION: 'true'
          LANDWARD_MYSQL_HOST: 127.0.0.1
          LANDWARD_MYSQL_DATABASE: landward_packaging
          LANDWARD_MYSQL_USER: landward_fixture
          LANDWARD_MYSQL_PASSWORD: fixture-password
          LANDWARD_MYSQL_SSL: ${{ startsWith(matrix.database, 'mysql:') && 'true' || 'false' }}
        run: |
          if [ '${{ matrix.drivers }}' = 'spigot' ]; then
            ./gradlew clean packagingTest --no-daemon -PserverSqliteVersion=3.51.3.0 -PserverMysqlVersion=9.6.0
          else
            ./gradlew clean packagingTest --no-daemon
          fi
